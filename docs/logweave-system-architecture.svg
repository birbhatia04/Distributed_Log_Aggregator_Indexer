<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">LogWeave distributed log aggregator and indexer architecture</title>
  <desc id="desc">Architecture showing log sources and a React dashboard connected through Vercel to a Railway-hosted FastAPI backend, Redis Streams, indexer workers, PostgreSQL, and a traffic generator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="railway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#17142c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 40px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.8px; }
      .subtitle { font-size: 18px; fill: #94a3b8; }
      .zone-title { font-size: 15px; font-weight: 700; fill: #cbd5e1; letter-spacing: 1.8px; }
      .node-title { font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .node-copy { font-size: 14px; fill: #94a3b8; }
      .label { font-size: 13px; font-weight: 650; fill: #cbd5e1; }
      .tag { font-size: 12px; font-weight: 700; fill: #cbd5e1; letter-spacing: 0.5px; }
      .flow { fill: none; stroke: #94a3b8; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #38bdf8; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrowBlue); }
      .control { fill: none; stroke: #34d399; stroke-width: 2.5; stroke-dasharray: 7 7; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity="0.16">
    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600M0 900H1600" stroke="#64748b"/>
    <path d="M100 0V1000M200 0V1000M300 0V1000M400 0V1000M500 0V1000M600 0V1000M700 0V1000M800 0V1000M900 0V1000M1000 0V1000M1100 0V1000M1200 0V1000M1300 0V1000M1400 0V1000M1500 0V1000" stroke="#64748b"/>
  </g>

  <text x="70" y="72" class="title">LogWeave</text>
  <text x="70" y="106" class="subtitle">Distributed Log Aggregator &amp; Indexer · real asynchronous processing pipeline</text>
  <g transform="translate(1318 48)">
    <rect width="212" height="48" rx="24" fill="#13273b" stroke="#285174"/>
    <circle cx="25" cy="24" r="7" fill="#34d399"/>
    <text x="44" y="30" class="label">DEPLOYED SYSTEM</text>
  </g>

  <!-- Deployment zones -->
  <rect x="50" y="150" width="300" height="650" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="78" y="185" class="zone-title">CLIENTS &amp; LOG PRODUCERS</text>

  <rect x="380" y="150" width="270" height="650" rx="28" fill="#0c1d2b" stroke="#1d4f68" stroke-width="2"/>
  <text x="408" y="185" class="zone-title">VERCEL · FRONTEND</text>

  <rect x="680" y="150" width="870" height="650" rx="28" fill="url(#railway)" stroke="#4c3c78" stroke-width="2"/>
  <text x="708" y="185" class="zone-title">RAILWAY · DISTRIBUTED BACKEND SERVICES</text>

  <!-- Client nodes -->
  <g filter="url(#shadow)">
    <rect x="80" y="230" width="240" height="130" rx="18" fill="#241a3c" stroke="#7c5ac7" stroke-width="2"/>
    <circle cx="116" cy="270" r="21" fill="#7c3aed"/>
    <text x="116" y="277" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">L</text>
    <text x="150" y="269" class="node-title">Log sources</text>
    <text x="105" y="308" class="node-copy">Applications · hosts · JSONL</text>
    <text x="105" y="332" class="node-copy">Single events or batches</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="430" width="240" height="130" rx="18" fill="#16263b" stroke="#3979a8" stroke-width="2"/>
    <circle cx="116" cy="470" r="21" fill="#0284c7"/>
    <text x="116" y="477" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">U</text>
    <text x="150" y="469" class="node-title">Dashboard user</text>
    <text x="105" y="508" class="node-copy">Searches indexed logs</text>
    <text x="105" y="532" class="node-copy">Runs failure experiments</text>
  </g>

  <!-- Vercel node -->
  <g filter="url(#shadow)">
    <rect x="410" y="330" width="210" height="230" rx="20" fill="#10263a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="450" cy="373" r="22" fill="#0369a1"/>
    <text x="450" y="380" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">R</text>
    <text x="487" y="369" class="node-title">React UI</text>
    <text x="437" y="414" class="node-copy">Overview &amp; live metrics</text>
    <text x="437" y="440" class="node-copy">Pipeline explorer</text>
    <text x="437" y="466" class="node-copy">Log explorer</text>
    <text x="437" y="492" class="node-copy">System lab controls</text>
    <rect x="437" y="515" width="151" height="26" rx="13" fill="#163d53"/>
    <text x="512" y="533" text-anchor="middle" class="tag">VITE · TYPESCRIPT</text>
  </g>

  <!-- Backend nodes -->
  <g filter="url(#shadow)">
    <rect x="720" y="230" width="250" height="200" rx="20" fill="#122845" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="760" cy="273" r="22" fill="#2563eb"/>
    <text x="760" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">API</text>
    <text x="798" y="268" class="node-title">FastAPI</text>
    <text x="798" y="292" class="node-copy">Ingestion + search API</text>
    <text x="748" y="334" class="node-copy">Validation · sessions · controls</text>
    <text x="748" y="360" class="node-copy">Metrics · SSE live stream</text>
    <rect x="748" y="384" width="128" height="26" rx="13" fill="#19385f"/>
    <text x="812" y="402" text-anchor="middle" class="tag">HTTP / API</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1020" y="230" width="220" height="200" rx="20" fill="#3a162e" stroke="#ec4899" stroke-width="2"/>
    <circle cx="1060" cy="273" r="22" fill="#db2777"/>
    <text x="1060" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">R</text>
    <text x="1098" y="268" class="node-title">Redis Streams</text>
    <text x="1048" y="315" class="node-copy">Per-session event queue</text>
    <text x="1048" y="341" class="node-copy">Consumer groups + pending</text>
    <text x="1048" y="367" class="node-copy">Metrics and control state</text>
    <rect x="1048" y="390" width="151" height="26" rx="13" fill="#59223f"/>
    <text x="1123" y="408" text-anchor="middle" class="tag">BURST BUFFER</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1290" y="230" width="220" height="200" rx="20" fill="#192638" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="1330" cy="273" r="22" fill="#3b82f6"/>
    <text x="1330" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">W</text>
    <text x="1367" y="268" class="node-title">Indexer worker</text>
    <text x="1318" y="315" class="node-copy">Reads consumer-group batches</text>
    <text x="1318" y="341" class="node-copy">Recovers abandoned work</text>
    <text x="1318" y="367" class="node-copy">Acknowledges after commit</text>
    <rect x="1318" y="390" width="150" height="26" rx="13" fill="#243852"/>
    <text x="1393" y="408" text-anchor="middle" class="tag">SCALE REPLICAS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1170" y="520" width="270" height="190" rx="20" fill="#11332f" stroke="#34d399" stroke-width="2"/>
    <circle cx="1212" cy="563" r="22" fill="#059669"/>
    <text x="1212" y="570" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">P</text>
    <text x="1250" y="558" class="node-title">PostgreSQL</text>
    <text x="1250" y="583" class="node-copy">Durable searchable storage</text>
    <text x="1198" y="626" class="node-copy">Full-text, service, severity,</text>
    <text x="1198" y="651" class="node-copy">time and trace-ID indexes</text>
    <rect x="1198" y="674" width="194" height="26" rx="13" fill="#174941"/>
    <text x="1295" y="692" text-anchor="middle" class="tag">IDEMPOTENT INSERTS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="540" width="280" height="150" rx="20" fill="#2f2712" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="782" cy="583" r="22" fill="#d97706"/>
    <text x="782" y="590" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">G</text>
    <text x="820" y="578" class="node-title">Traffic generator</text>
    <text x="768" y="625" class="node-copy">Creates realistic service logs</text>
    <text x="768" y="651" class="node-copy">Start · pause · burst · stop</text>
  </g>

  <!-- Main paths -->
  <path d="M320 295 C470 295, 565 285, 720 285" class="flow"/>
  <text x="448" y="275" class="label">POST /api/logs · batch · JSONL</text>

  <path d="M320 495 H410" class="flow"/>
  <text x="333" y="478" class="label">HTTPS</text>

  <path d="M620 405 C660 405, 676 360, 720 350" class="flow"/>
  <text x="635" y="391" class="label">/api proxy</text>

  <path d="M970 300 H1020" class="flow"/>
  <text x="979" y="282" class="label">XADD</text>

  <path d="M1240 300 H1290" class="flow"/>
  <text x="1248" y="282" class="label">XREADGROUP</text>

  <path d="M1400 430 V485 C1400 503, 1375 520, 1358 520" class="flow"/>
  <text x="1412" y="481" class="label">INSERT</text>

  <path d="M1170 610 H1088 C1035 610, 995 522, 930 430" class="return"/>
  <text x="998" y="587" class="label" fill="#7dd3fc">Search committed logs</text>

  <path d="M1020 625 C920 625, 880 500, 850 430" class="control"/>
  <text x="842" y="518" class="label" fill="#6ee7b7">Metrics + worker controls</text>

  <path d="M880 540 C880 488, 842 474, 842 430" class="flow"/>
  <text x="895" y="496" class="label">Generated traffic</text>

  <!-- Bottom guarantees -->
  <rect x="50" y="835" width="1500" height="115" rx="22" fill="#0d1726" stroke="#26364b"/>
  <text x="78" y="870" class="zone-title">CORE SYSTEM GUARANTEES</text>

  <g transform="translate(78 893)">
    <circle cx="9" cy="9" r="9" fill="#3b82f6"/>
    <path d="M5 9l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="28" y="15" class="label">At-least-once delivery</text>
  </g>
  <g transform="translate(345 893)">
    <circle cx="9" cy="9" r="9" fill="#34d399"/>
    <path d="M5 9l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="28" y="15" class="label">Idempotent database writes</text>
  </g>
  <g transform="translate(672 893)">
    <circle cx="9" cy="9" r="9" fill="#ec4899"/>
    <path d="M5 9l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="28" y="15" class="label">Backpressure through Redis</text>
  </g>
  <g transform="translate(985 893)">
    <circle cx="9" cy="9" r="9" fill="#f59e0b"/>
    <path d="M5 9l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="28" y="15" class="label">Failure recovery with XAUTOCLAIM</text>
  </g>
  <g transform="translate(1344 893)">
    <circle cx="9" cy="9" r="9" fill="#8b5cf6"/>
    <path d="M5 9l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="28" y="15" class="label">Session isolation</text>
  </g>
</svg>
